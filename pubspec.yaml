name: dokanmate
description: Offline-first Android shop management app for small businesses.
publish_to: "none"
version: 1.0.0+2

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.1
  path: ^1.9.0
  flutter_secure_storage: ^9.2.2
  intl: ^0.19.0
  excel: ^4.0.6
  pdf: ^3.11.3
  printing: ^5.14.3
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  cross_file: ^0.3.4+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
