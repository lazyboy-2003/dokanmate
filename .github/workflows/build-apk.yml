name: Build DokanMate APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true
      - name: Create Android project
        run: flutter create --platforms=android --org com.dokanmate .
      - name: Set Android NDK version
        run: |
          sed -i 's/^[[:space:]]*ndkVersion = .*/    ndkVersion = "27.0.12077973"/' android/app/build.gradle.kts
      - name: Configure Android activity and permissions
        run: |
          ACTIVITY=$(find android/app/src/main -name MainActivity.kt | head -n 1)
          sed -i 's/import io.flutter.embedding.android.FlutterActivity/import io.flutter.embedding.android.FlutterFragmentActivity/' "$ACTIVITY"
          sed -i 's/: FlutterActivity()/: FlutterFragmentActivity()/' "$ACTIVITY"
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.USE_BIOMETRIC"/>' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.SEND_SMS"/>' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>' android/app/src/main/AndroidManifest.xml
      - name: Add automatic SMS reminder Android code
        shell: bash
        run: |
          DIR="android/app/src/main/kotlin/com/dokanmate/dokanmate"
          mkdir -p "$DIR"
          cat > "$DIR/MainActivity.kt" <<'EOF'
package com.dokanmate.dokanmate
import android.Manifest
import android.content.pm.PackageManager
import androidx.core.app.ActivityCompat
import io.flutter.embedding.android.FlutterFragmentActivity
import io.flutter.embedding.engine.FlutterEngine
import io.flutter.plugin.common.MethodChannel

class MainActivity : FlutterFragmentActivity() {
    private val requestCode = 9201
    private var permissionResult: MethodChannel.Result? = null
    override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
        super.configureFlutterEngine(flutterEngine)
        MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "dokanmate/sms").setMethodCallHandler { call, result ->
            when (call.method) {
                "hasSmsPermission" -> result.success(ActivityCompat.checkSelfPermission(this, Manifest.permission.SEND_SMS) == PackageManager.PERMISSION_GRANTED)
                "requestSmsPermission" -> {
                    if (ActivityCompat.checkSelfPermission(this, Manifest.permission.SEND_SMS) == PackageManager.PERMISSION_GRANTED) result.success(true)
                    else { permissionResult = result; ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.SEND_SMS), requestCode) }
                }
                "scheduleReminder" -> {
                    val partyId = call.argument<Int>("partyId") ?: -1
                    val trigger = call.argument<Long>("triggerAtMillis") ?: 0L
                    SmsReminderScheduler.schedule(this, partyId, trigger)
                    result.success(true)
                }
                else -> result.notImplemented()
            }
        }
    }
    override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
        super.onRequestPermissionsResult(requestCode, permissions, grantResults)
        if (requestCode == this.requestCode) {
            permissionResult?.success(grantResults.isNotEmpty() && grantResults[0] == PackageManager.PERMISSION_GRANTED)
            permissionResult = null
        }
    }
}
