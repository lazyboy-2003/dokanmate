name: Build DokanMate APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true
      - name: Create Android project
        run: flutter create --platforms=android --org com.dokanmate .
      - name: Set Android NDK version
        run: |
          sed -i 's/^[[:space:]]*ndkVersion = .*/    ndkVersion = "27.0.12077973"/' android/app/build.gradle.kts
      - name: Configure biometric Android activity
        run: |
          ACTIVITY=$(find android/app/src/main -name MainActivity.kt | head -n 1)
          sed -i 's/import io.flutter.embedding.android.FlutterActivity/import io.flutter.embedding.android.FlutterFragmentActivity/' "$ACTIVITY"
          sed -i 's/extends FlutterActivity/extends FlutterFragmentActivity/' "$ACTIVITY"
          sed -i 's/: FlutterActivity()/: FlutterFragmentActivity()/' "$ACTIVITY"
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.USE_BIOMETRIC"/>' android/app/src/main/AndroidManifest.xml
      - name: Remove generated test
        run: rm -f test/widget_test.dart
      - name: Get dependencies
        run: flutter pub get
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dokanmate-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

# rebuild after DokanMate fixes

# rebuild after party/payment/language fixes
