          cat > "$DIR/SmsReminderReceiver.kt" <<'EOF'
package com.dokanmate.dokanmate

import android.Manifest
import android.content.BroadcastReceiver
import android.content.Context
import android.content.Intent
import android.content.pm.PackageManager
import android.database.sqlite.SQLiteDatabase
import android.telephony.SmsManager
import androidx.core.content.ContextCompat
import java.text.SimpleDateFormat
import java.util.Date
import java.util.Locale

class SmsReminderReceiver : BroadcastReceiver() {
    override fun onReceive(context: Context, intent: Intent) {
        if (intent.action != "com.dokanmate.AUTOMATIC_SMS_REMINDER") return
        if (ContextCompat.checkSelfPermission(context, Manifest.permission.SEND_SMS) != PackageManager.PERMISSION_GRANTED) return
        val partyId = intent.getIntExtra("partyId", -1)
        if (partyId <= 0) return
        val file = context.getDatabasePath("dokanmate.db")
        if (!file.exists()) return
        val db = SQLiteDatabase.openDatabase(file.path, null, SQLiteDatabase.OPEN_READWRITE)
        try {
            val enabled = db.rawQuery("SELECT auto_sms_reminder FROM business WHERE id=1", null).use { it.moveToFirst() && it.getInt(0) == 1 }
            if (!enabled) return
            var name = "Customer"; var phone = ""; var balance = 0.0; var shop = "our shop"
            db.rawQuery("SELECT name, phone, balance FROM parties WHERE id=?", arrayOf(partyId.toString())).use { c ->
                if (!c.moveToFirst()) return
                name = c.getString(0) ?: "Customer"; phone = c.getString(1) ?: ""; balance = c.getDouble(2)
            }
            if (balance <= 0.01) return
            db.rawQuery("SELECT name FROM business WHERE id=1", null).use { c -> if (c.moveToFirst()) { val value = c.getString(0); if (!value.isNullOrBlank()) shop = value } }
            val digits = phone.filter { it.isDigit() }
            if (digits.length < 10) return
            val number = if (digits.length == 10) "91$digits" else digits
            val dateKey = SimpleDateFormat("yyyyMMdd", Locale.US).format(Date())
            val prefs = context.getSharedPreferences("sms_reminders", Context.MODE_PRIVATE)
            val sentKey = "sent_${partyId}_$dateKey"
            if (prefs.getBoolean(sentKey, false)) return
            val amount = String.format(Locale.US, "%.2f", balance)
            val message = "Dear $name, your payment of Rs. $amount is due at $shop. Please make the payment at your convenience. Thank you."
            val sms = SmsManager.getDefault()
            val parts = sms.divideMessage(message)
            if (parts.size > 1) sms.sendMultipartTextMessage(number, null, parts, null, null)
            else sms.sendTextMessage(number, null, message, null, null)
            prefs.edit().putBoolean(sentKey, true).apply()
        } catch (_: Exception) {
        } finally { db.close() }
    }
}
EOF
          cat > "$DIR/SmsReminderBootReceiver.kt" <<'EOF'
package com.dokanmate.dokanmate
import android.content.BroadcastReceiver
import android.content.Context
import android.content.Intent
class SmsReminderBootReceiver : BroadcastReceiver() {
    override fun onReceive(context: Context, intent: Intent?) {
        if (intent?.action == Intent.ACTION_BOOT_COMPLETED) SmsReminderScheduler.scheduleAll(context)
    }
}
