name: Build DokanMate APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true
      - name: Create Android project
        run: flutter create --platforms=android --org com.dokanmate .
      - name: Configure Android build
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          s = s.replace('ndkVersion = flutter.ndkVersion', 'ndkVersion = "27.0.12077973"')
          if 'minSdk = 23' not in s:
              s = s.replace('defaultConfig {', 'defaultConfig {\n        minSdk = 23', 1)
          p.write_text(s)
          print(p.read_text())
          PY
      - name: Configure biometric activity and permissions
        run: |
          ACTIVITY=$(find android/app/src/main -name MainActivity.kt | head -n 1)
          sed -i 's/import io.flutter.embedding.android.FlutterActivity/import io.flutter.embedding.android.FlutterFragmentActivity/' "$ACTIVITY"
          sed -i 's/: FlutterActivity()/: FlutterFragmentActivity()/' "$ACTIVITY"
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.USE_BIOMETRIC"/>' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.SEND_SMS"/>' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.WAKE_LOCK"/>' android/app/src/main/AndroidManifest.xml
          sed -i '/<application /a\        <service android:name="dev.fluttercommunity.plus.androidalarmmanager.AlarmService" android:permission="android.permission.BIND_JOB_SERVICE" android:exported="false"/>' android/app/src/main/AndroidManifest.xml
          sed -i '/<application /a\        <receiver android:name="dev.fluttercommunity.plus.androidalarmmanager.AlarmBroadcastReceiver" android:exported="false"/>' android/app/src/main/AndroidManifest.xml
          sed -i '/<application /a\        <receiver android:name="dev.fluttercommunity.plus.androidalarmmanager.RebootBroadcastReceiver" android:enabled="false" android:exported="false"/>' android/app/src/main/AndroidManifest.xml
      - name: Remove generated test
        run: rm -f test/widget_test.dart
      - name: Get dependencies
        run: flutter pub get
      - name: Fix telephony Android namespace
        run: |
          TGRADLE=$(find "$HOME/.pub-cache/hosted/pub.dev" -path "*/telephony-0.2.0/android/build.gradle" | head -n 1)
          if [ -n "$TGRADLE" ]; then
            sed -i '/android {/a\    namespace "com.shounakmulay.telephony"' "$TGRADLE"
          fi
      - name: Verify Android min SDK
        run: grep -n "minSdk" android/app/build.gradle.kts
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dokanmate-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
