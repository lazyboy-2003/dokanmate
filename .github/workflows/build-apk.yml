package com.dokanmate.dokanmate

import android.app.AlarmManager
import android.app.PendingIntent
import android.content.Context
import android.content.Intent
import android.database.sqlite.SQLiteDatabase
import java.text.SimpleDateFormat
import java.util.Calendar
import java.util.Locale

object SmsReminderScheduler {
    private const val ACTION = "com.dokanmate.AUTOMATIC_SMS_REMINDER"
    fun schedule(context: Context, partyId: Int, triggerAtMillis: Long) {
        if (partyId <= 0 || triggerAtMillis <= 0L) return
        val alarm = context.getSystemService(Context.ALARM_SERVICE) as AlarmManager
        val intent = Intent(context, SmsReminderReceiver::class.java).apply {
            action = ACTION
            putExtra("partyId", partyId)
        }
        val requestCode = partyId * 100000 + ((triggerAtMillis / 86400000L) % 100000L).toInt()
        val pending = PendingIntent.getBroadcast(context, requestCode, intent, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
        alarm.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, triggerAtMillis, pending)
    }
    fun scheduleAll(context: Context) {
        val file = context.getDatabasePath("dokanmate.db")
        if (!file.exists()) return
        val db = SQLiteDatabase.openDatabase(file.path, null, SQLiteDatabase.OPEN_READWRITE)
        try {
            ensureColumns(db)
            val enabled = db.rawQuery("SELECT auto_sms_reminder FROM business WHERE id=1", null).use { it.moveToFirst() && it.getInt(0) == 1 }
            if (!enabled) return
            val hm = db.rawQuery("SELECT sms_reminder_hour, sms_reminder_minute FROM business WHERE id=1", null).use { if (it.moveToFirst()) intArrayOf(it.getInt(0), it.getInt(1)) else intArrayOf(10, 0) }
            val seen = HashSet<String>()
            db.rawQuery("SELECT s.party_id, s.date, p.credit_days FROM sales s JOIN parties p ON p.id=s.party_id WHERE s.party_id IS NOT NULL AND s.due > 0 AND LOWER(COALESCE(p.type,'')) IN ('customer','both')", null).use { c ->
                while (c.moveToNext()) {
                    val partyId = c.getInt(0)
                    val date = c.getString(1)
                    val creditDays = c.getInt(2)
                    val parsed = runCatching { SimpleDateFormat("yyyy-MM-dd", Locale.US).parse(date) }.getOrNull() ?: continue
                    val cal = Calendar.getInstance().apply {
                        time = parsed
                        add(Calendar.DAY_OF_YEAR, creditDays)
                        set(Calendar.HOUR_OF_DAY, hm[0]); set(Calendar.MINUTE, hm[1]); set(Calendar.SECOND, 0); set(Calendar.MILLISECOND, 0)
                    }
                    var trigger = cal.timeInMillis
                    if (trigger < System.currentTimeMillis()) trigger = System.currentTimeMillis() + 120000L
                    val key = "$partyId-${cal.get(Calendar.YEAR)}-${cal.get(Calendar.DAY_OF_YEAR)}"
                    if (seen.add(key)) schedule(context, partyId, trigger)
                }
            }
        } finally { db.close() }
    }
    private fun ensureColumns(db: SQLiteDatabase) {
        val cols = HashSet<String>()
        db.rawQuery("PRAGMA table_info(business)", null).use { c -> while (c.moveToNext()) cols.add(c.getString(1)) }
        if (!cols.contains("auto_sms_reminder")) db.execSQL("ALTER TABLE business ADD COLUMN auto_sms_reminder INTEGER DEFAULT 0")
        if (!cols.contains("sms_reminder_hour")) db.execSQL("ALTER TABLE business ADD COLUMN sms_reminder_hour INTEGER DEFAULT 10")
        if (!cols.contains("sms_reminder_minute")) db.execSQL("ALTER TABLE business ADD COLUMN sms_reminder_minute INTEGER DEFAULT 0")
    }
}
